name: ProfileSets checks
on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: profilesets-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: Vendicated/Vencord
          ref: 0850f37fbb1623aa6330764d8f4b1e0b2617dcdf
          path: .vencord
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install Vencord dependencies
        working-directory: .vencord
        run: pnpm install --frozen-lockfile
      - name: Install plugin in the verification checkout
        run: |
          mkdir -p .vencord/src/userplugins
          cp -R ProfileSets .vencord/src/userplugins/profileSets
      - name: Build desktop
        working-directory: .vencord
        run: pnpm build
      - name: Typecheck with Vencord
        working-directory: .vencord
        run: pnpm testTsc
      - name: Build web
        working-directory: .vencord
        run: pnpm buildWeb
