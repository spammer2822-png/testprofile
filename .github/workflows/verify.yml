name: ProfileSets checks
on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: profilesets-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: Vendicated/Vencord
          ref: 0850f37fbb1623aa6330764d8f4b1e0b2617dcdf
          path: .vencord
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install Vencord dependencies
        working-directory: .vencord
        run: pnpm install --frozen-lockfile
      - name: Install plugin in the verification checkout
        run: |
          mkdir -p .vencord/src/userplugins
          cp -R ProfileSets .vencord/src/userplugins/profileSets
      - name: Regression tests
        run: node scripts/test.mjs
      - name: Install UI test dependencies
        run: npm install --prefix scripts/ui --ignore-scripts --no-audit --no-fund
      - name: Browser interaction and layout checks
        run: node scripts/ui/check.mjs
      - name: Build desktop
        working-directory: .vencord
        run: pnpm build
      - name: Typecheck with Vencord
        working-directory: .vencord
        run: pnpm testTsc
      - name: Build web
        working-directory: .vencord
        run: pnpm buildWeb
      - name: Build Discord compatibility reporter
        working-directory: .vencord
        run: pnpm buildReporter
      - name: Inspect current Discord Stable profile modules
        run: node scripts/check-discord.mjs
      - name: Package verified source
        run: |
          mkdir -p package
          cp -R ProfileSets package/ProfileSets
          cp -R test-results package/test-results
          cp README.md package/README.md
          python3 - <<'PY'
          import pathlib, zipfile
          root = pathlib.Path("package")
          with zipfile.ZipFile("ProfileSets-tested.zip", "w", zipfile.ZIP_DEFLATED) as z:
              for path in sorted(root.rglob("*")):
                  if path.is_file():
                      z.write(path, path.relative_to(root))
          with zipfile.ZipFile("ProfileSets-tested.zip") as z:
              assert z.testzip() is None
              assert "ProfileSets/index.tsx" in z.namelist()
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ProfileSets-tested
          path: package/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ProfileSets-test-results
          path: test-results/
          if-no-files-found: ignore
